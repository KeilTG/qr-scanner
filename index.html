<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-сканер</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e7e5e4;
      --code-bg: #f5f5f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --border: #292524;
        --code-bg: #0c0a09;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.hint { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .viewer {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      margin-bottom: 16px;
      display: none;
    }
    .viewer.active { display: block; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .frame {
      position: absolute;
      inset: 18%;
      border: 3px solid rgba(255, 255, 255, .85);
      border-radius: 12px;
      pointer-events: none;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      margin-top: 8px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--code-bg); }
    #status { min-height: 21px; margin: 14px 0 0; color: var(--muted); font-size: 14px; }
    #status.error { color: #dc2626; }
    pre {
      display: none;
      margin: 16px 0 0;
      padding: 12px;
      text-align: left;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>QR-сканер</h1>
    <p class="hint">Результат выводится в консоль браузера (F12 → Console)</p>

    <div class="viewer" id="viewer">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
    </div>

    <button id="scanBtn">Сканировать QR-код</button>
    <button id="fileBtn" class="secondary">Загрузить картинку с QR</button>
    <input id="fileInput" type="file" accept="image/*" hidden>

    <p id="status"></p>
    <pre id="output"></pre>
  </main>

  <canvas id="canvas" hidden></canvas>
  <script src="jsQR.js"></script>
  <script>
    const video = document.getElementById("video");
    const viewer = document.getElementById("viewer");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const scanBtn = document.getElementById("scanBtn");
    const fileBtn = document.getElementById("fileBtn");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const output = document.getElementById("output");

    let stream = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    // Если в QR лежит JSON — разбираем его, иначе отдаём как строку.
    function toResult(raw, source) {
      let data = raw;
      try { data = JSON.parse(raw); } catch { /* обычный текст */ }
      return { data, raw, source, scannedAt: new Date().toISOString() };
    }

    function showResult(raw, source) {
      const result = toResult(raw, source);
      const json = JSON.stringify(result, null, 2);
      console.log(json);
      output.textContent = json;
      output.style.display = "block";
      setStatus("Готово — JSON выведен в консоль");
    }

    function decode(width, height) {
      const image = ctx.getImageData(0, 0, width, height);
      return jsQR(image.data, width, height, { inversionAttempts: "attemptBoth" });
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      viewer.classList.remove("active");
      scanBtn.textContent = "Сканировать QR-код";
    }

    function tick() {
      if (!stream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const code = decode(canvas.width, canvas.height);
        if (code) {
          stopCamera();
          showResult(code.data, "camera");
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    async function startCamera() {
      output.style.display = "none";
      setStatus("Запрашиваю доступ к камере…");
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false,
        });
      } catch (err) {
        setStatus("Нет доступа к камере: " + err.message, true);
        console.error(err);
        return;
      }
      video.srcObject = stream;
      await video.play();
      viewer.classList.add("active");
      scanBtn.textContent = "Остановить";
      setStatus("Наведи камеру на QR-код");
      requestAnimationFrame(tick);
    }

    scanBtn.addEventListener("click", () => (stream ? (stopCamera(), setStatus("")) : startCamera()));

    fileBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      stopCamera();
      const img = new Image();
      img.onload = () => {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(img.src);
        const code = decode(canvas.width, canvas.height);
        if (code) {
          showResult(code.data, "image");
        } else {
          output.style.display = "none";
          setStatus("На картинке не найден QR-код", true);
        }
      };
      img.src = URL.createObjectURL(file);
    });
  </script>
</body>
</html>
