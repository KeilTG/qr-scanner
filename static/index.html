<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>ФК — QR</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #dbeafe;
      --border: #e7e5e4;
      --code-bg: #f5f5f4;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --bad: #dc2626;
      --bad-soft: #fee2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: #172554;
        --border: #292524;
        --code-bg: #0c0a09;
        --ok: #4ade80;
        --ok-soft: #14321f;
        --warn: #fbbf24;
        --warn-soft: #3a2a0c;
        --bad: #f87171;
        --bad-soft: #3b1515;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .narrow { max-width: 440px; }

    header.bar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 5;
    }
    header.bar .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 18px; }
    .who { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; line-height: 1.3; }
    .who b { color: var(--text); font-weight: 600; }

    nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-top: 1px solid var(--border); }
    nav.tabs button {
      width: auto; background: none; color: var(--muted); border-radius: 0;
      border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 500; white-space: nowrap;
    }
    nav.tabs button:hover { background: none; color: var(--text); }
    nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card > h2, .card > h3 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card > h3 { font-size: 15px; }
    .sp { flex: 1; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .hint, .muted { color: var(--muted); font-size: 13px; }
    p.hint { margin: 0 0 16px; }

    button {
      padding: 11px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .5; cursor: default; }
    button.block { width: 100%; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--code-bg); }
    button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; font-weight: 500; }
    button.ghost:hover { background: var(--code-bg); color: var(--text); }
    button.ok { background: var(--ok); }
    button.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
    button.danger { color: var(--bad); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1 1 160px; }
    .row > button { flex: 0 0 auto; }
    .stack > * + * { margin-top: 8px; }

    label.f { display: block; font-size: 13px; color: var(--muted); }
    input, select {
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: var(--code-bg); }
    .scroll { overflow-x: auto; }
    .num { text-align: right; white-space: nowrap; }

    .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .pill.bad { background: var(--bad-soft); color: var(--bad); }
    .pill.info { background: var(--accent-soft); color: var(--accent); }
    .pill.muted { background: var(--code-bg); color: var(--muted); border: 1px solid var(--border); }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .tile .v { font-size: 26px; font-weight: 700; }
    .tile .l { color: var(--muted); font-size: 12px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

    /* Сканер */
    .viewer {
      position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
      background: #000; margin-bottom: 12px; display: none; max-width: 420px; margin-left: auto; margin-right: auto;
    }
    .viewer.active { display: block; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; inset: 18%; border: 3px solid rgba(255, 255, 255, .85); border-radius: 12px; pointer-events: none; }
    #status { min-height: 21px; margin: 10px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
    #status.error { color: var(--bad); }
    .result { border: 2px solid var(--accent); border-radius: 14px; padding: 16px; margin-top: 14px; }
    .result.done { border-color: var(--ok); }

    /* Участник */
    .qr { background: #fff; border-radius: 14px; padding: 10px; display: block; width: 100%; max-width: 300px; margin: 8px auto; aspect-ratio: 1; }
    .code { font: 600 20px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 1px; text-align: center; }
    .bigpts { font-size: 54px; font-weight: 800; line-height: 1; text-align: center; color: var(--accent); }
    .center { text-align: center; }
    .list-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .list-item:last-child { border-bottom: 0; }
    .list-item .grow { flex: 1; min-width: 0; }
    .empty { color: var(--muted); text-align: center; padding: 16px 0; }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--bad); color: #fff; }
    details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  </style>
</head>
<body>
  <div id="app"><div class="wrap center muted" style="padding-top:40px">Загрузка…</div></div>
  <div class="toast" id="toast"></div>
  <canvas id="canvas" hidden></canvas>
  <script src="jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
